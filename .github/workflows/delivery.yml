name: Delivery checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tranzora
          POSTGRES_DB: tranzora
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tranzora -d tranzora"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ConnectionStrings__Postgres: Host=localhost;Database=tranzora;Username=tranzora;Password=ci-disposable-only
      DATABASE_URL: postgresql://tranzora:ci-disposable-only@localhost:5432/tranzora?sslmode=disable
      ConnectionStrings__Redis: redis://localhost:6379
      ASPNETCORE_ENVIRONMENT: Testing
      ASPNETCORE_URLS: http://localhost:5080
      App__PublicOrigin: http://localhost:3000
      App__SecureCookies: 'false'
      BACKEND_URL: http://localhost:5080
      AUTH_URL: http://localhost:3000
      TEST_WEB_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: dotnet build backend/Tranzora.slnx --configuration Release
      - run: npm run typecheck
      - run: npm run build
      - name: Prepare database and start services
        shell: bash
        run: |
          set -euo pipefail
          dotnet backend/Tranzora.Api/bin/Release/net10.0/Tranzora.Api.dll --migrate
          dotnet backend/Tranzora.Api/bin/Release/net10.0/Tranzora.Api.dll --environment Development --seed-demo
          dotnet backend/Tranzora.Api/bin/Release/net10.0/Tranzora.Api.dll > /tmp/tranzora-api.log 2>&1 &
          npm start > /tmp/tranzora-web.log 2>&1 &
          for endpoint in http://localhost:5080/health/ready http://localhost:3000/login; do
            ready=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent --max-time 3 "$endpoint" > /dev/null; then ready=true; break; fi
              sleep 2
            done
            test "$ready" = true
          done
      - run: npm run test:integration
      - run: npm run test:driver
      - run: npx playwright install --with-deps chrome
      - run: npm run test:contrast
      - run: npx playwright test tests/ui/delivery.spec.ts tests/ui/branding.spec.ts tests/ui/workspace.spec.ts tests/ui/record-controls.spec.ts tests/ui/language.spec.ts tests/ui/cinematic.spec.ts tests/ui/reset-password.spec.ts tests/ui/auth-actions.spec.ts tests/ui/oauth.spec.ts
      - run: docker build -t tranzora-web:ci .
      - run: docker build -t tranzora-api:ci backend
      - run: docker build -t tranzora-postgres:ci deploy/postgres
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-failures
          path: TestResults/
          retention-days: 3
