events { worker_connections 1024; }
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream backend {
        zone backend 64k;
        least_conn;
        server api1:8080 resolve max_fails=3 fail_timeout=10s;
        server api2:8080 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }
    upstream frontend {
        zone frontend 64k;
        server web:3000 resolve;
        keepalive 16;
    }
    server {
        listen 8080;
        client_max_body_size 64k;
        server_tokens off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite user-supplied proxy headers at the trusted edge.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        # Never automatically retry mutations at the load balancer.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        location /api/ { proxy_pass http://backend; }
        location = /api/health { proxy_pass http://backend/health/ready; }
        location /health/ { proxy_pass http://backend; }
        location / { proxy_pass http://frontend; }
    }
}
